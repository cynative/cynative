# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

builds:
  - main: ./cmd/cynative
    ldflags:
      - -s -w
      - -X github.com/cynative/cynative/internal/cli.version={{.Version}}
      - -X github.com/cynative/cynative/internal/cli.commit={{.ShortCommit}}
      - -X github.com/cynative/cynative/internal/cli.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - cmd: scripts/release/sign-darwin-binary.sh "{{ .Path }}" "{{ .Target }}" "{{ .IsSnapshot }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Sign checksums.txt with cosign keyless (Fulcio + Rekor, authenticated by the GitHub
# Actions OIDC token) into a single Sigstore bundle. Signing the manifest authenticates
# every archive transitively: verify the bundle, then check an archive's sha256 against
# its row. This is what makes a release verifiable without the gh CLI, and the only part
# of the pipeline's integrity story that OpenSSF Scorecard can see.
#
# goreleaser uploads the bundle to the adopted draft alongside the archives, so it needs
# no separate upload path, but scripts/release/assert-assets.sh must admit the
# "Signature" artifact type or the exact-asset-set gate rejects it as surplus.
#
# No `certificate:` field on purpose: the bundle already carries the Fulcio certificate
# and the transparency-log proof, and a certificate artifact is one the asset gate
# deliberately does not admit.
#
# No --new-bundle-format: it exists in cosign v3.1.2 but already defaults to true and is
# deprecated because that will become the only format. No --oidc-provider either:
# sign-blob builds its KeyOpts without copying it (unlike `sign`), so the flag is
# silently ignored on this path. Ambient discovery is the working route.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"

scoops:
  - repository:
      owner: cynative
      name: scoop-bucket
      branch: main
    # skip_upload: goreleaser still generates its Scoop manifest locally under
    # dist/ but no longer pushes it during the pre-publish build (cynative#103).
    # The live manifest is rendered and pushed after publish by
    # scripts/release/render-scoop.sh + publish-scoop.sh, which is the
    # authoritative renderer; the fields below only shape goreleaser's inert
    # local copy.
    skip_upload: true
    # Scoop's recommended layout keeps manifests in a `bucket/` subdirectory
    # (mirrors the official ScoopInstaller bucket template).
    directory: bucket
    homepage: "https://github.com/cynative/cynative"
    description: "Agentic security research across your code, cloud, and runtime (read-only)"
    license: "Apache-2.0"

release:
  # Immutable-releases handoff:
  # release-please creates a DRAFT titled exactly like the tag (e.g. "v0.4.0").
  # goreleaser must adopt that draft — matched by draft title == the git tag
  # string (hardcoded in findRelease) — keep its changelog body, upload, and
  # STOP. With draft: true goreleaser's publish step is a no-op; the release
  # workflow owns the publish PATCH, which is the instant the release (assets
  # + tag) becomes immutable, and runs it only after all assertions pass.
  draft: true
  use_existing_draft: true
  mode: keep-existing

changelog:
  disable: true
