name: Dependabot auto-merge

# Runs in the trusted default-branch context after CI completes on a PR, so the App key
# (an Actions secret) is never exposed to a Dependabot PR's head-modified workflow code,
# and the merge is attributed to the App so its push to main triggers the Release Pipeline
# (GITHUB_TOKEN merges never trigger further workflows, which left the release PR stale).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# The dedicated App token performs the body edit and the merge; GITHUB_TOKEN only
# reads the PR to identify it and checks out the trusted default-branch scripts.
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Identify the PR from the completed run's head SHA using the read-only GITHUB_TOKEN.
      # Only an open, base-main, Dependabot-authored PR whose current head is still exactly
      # that SHA, and whose every commit is Dependabot's own, proceeds; everything else
      # no-ops (human PRs, PRs someone else pushed to, push-triggered CI runs, or a stale
      # run after a Dependabot rebase, which the new head's CI run re-decides), so the App
      # token is never even minted for them.
      - name: Resolve Dependabot PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          num="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state=="open" and .base.ref=="main" and .user.login=="dependabot[bot]" and .head.sha==env.HEAD_SHA)][0].number // empty')"
          if [ -z "${num}" ]; then
            echo "No matching open Dependabot PR for ${HEAD_SHA}; nothing to do."
            exit 0
          fi
          # A Dependabot-authored PR is not enough: someone else may have pushed to
          # its branch. Dependabot's own commits are authored by dependabot[bot] and
          # committed and signed by GitHub (web-flow), so require all three on every
          # commit, and require that the listing is complete (the API caps it).
          commits_url="/repos/${GITHUB_REPOSITORY}/pulls/${num}/commits"
          expected="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${num}" --jq '.commits')"
          listed="$(gh api --paginate "${commits_url}" --jq '.[].sha' | wc -l)"
          foreign="$(gh api --paginate "${commits_url}" --jq '.[] | select(.author.login != "dependabot[bot]" or .committer.login != "web-flow" or .commit.verification.verified != true) | "\(.sha[0:7]) author=\(.author.login // "none") committer=\(.committer.login // "none") verified=\(.commit.verification.verified)"')"
          if [ "${listed}" != "${expected}" ] || [ -n "${foreign}" ]; then
            echo "PR #${num} has commits that are not Dependabot's own (listed ${listed} of ${expected}); not merging."
            [ -z "${foreign}" ] || echo "${foreign}"
            exit 0
          fi
          echo "Matched Dependabot PR #${num}; all ${listed} commits are Dependabot's own."
          echo "number=${num}" >> "${GITHUB_OUTPUT}"
      # Mint a dedicated-App installation token, scoped to this repo and downscoped to the
      # three permissions merging a workflow-touching PR needs. Only reached
      # for a real Dependabot PR. This is the trusted default-branch workflow, so the key
      # is never handed to unreviewed PR code.
      - name: Generate App Token
        id: app-token
        if: steps.pr.outputs.number != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cynative
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # Check out the trusted default-branch copy of the override renderer. A
      # workflow_run job resolves to the default branch's commit, so a Dependabot
      # PR that modifies the script can never influence this run.
      # continue-on-error here too: a checkout failure must degrade to the group title, never
      # block the merge.
      - name: Checkout override renderer
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/dependabot-commit-override.sh
          sparse-checkout-cone-mode: false
      # Rewrite the PR body with a release-please commit-override block so the
      # changelog lists each updated package instead of the opaque group title.
      # Fail-safe: an unparseable message or an already-current body skips the
      # edit and the squash title renders as before; continue-on-error keeps a
      # failure here from ever blocking the merge.
      # The metadata commit is selected by content, not position: a branch updated by a merge
      # from main has a metadata-free head commit, and the bump commit is what carries
      # updated-dependencies.
      - name: Write per-package changelog override
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '[.[].commit.message | select(contains("updated-dependencies:"))] | last // ""' > /tmp/commit-msg
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > /tmp/pr-body
          # Capture stderr so a budget miss is not misreported as "no metadata"
          # (that ambiguity hid #170 when Dependabot's body hit GitHub's ceiling).
          new_body="$(sh scripts/ci/dependabot-commit-override.sh render /tmp/pr-body < /tmp/commit-msg 2>/tmp/ovr.err)" || true
          if [ -z "${new_body}" ]; then
            if [ -s /tmp/ovr.err ]; then
              cat /tmp/ovr.err
              echo "Leaving the body unchanged."
            else
              echo "No dependency metadata parsed; leaving the body unchanged."
            fi
            exit 0
          fi
          if [ "${new_body}" = "$(cat /tmp/pr-body)" ]; then
            echo "Override already current."
            exit 0
          fi
          gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f body="${new_body}"
          echo "Wrote per-package override to PR #${PR_NUMBER}."
      # Merge directly with the App token so the completed merge is attributed to the App
      # and its push to main triggers the Release Pipeline. A direct merge, not auto-merge,
      # so nothing stays armed for someone with write access to push to afterwards.
      # --match-head-commit makes the merge fail unless the head is still exactly the SHA CI
      # passed on, and the commit check above ran on that head. Retried because the body edit
      # above races the merge: the PATCH fires a pull_request_target "edited" event that
      # re-runs the required "Validate PR title" check, and the ruleset rejects a merge made
      # while it is pending ("Validate PR title is expected"). Nothing re-triggers this
      # workflow, so a later attempt, after the check finishes, is what merges. A moved
      # head or a branch that is behind main is logged and not retried.
      - name: Merge Dependabot PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            if out="$(gh pr merge --squash --match-head-commit "${HEAD_SHA}" --repo "${GITHUB_REPOSITORY}" "${PR_NUMBER}" 2>&1)"; then
              echo "${out}"
              echo "Merged PR #${PR_NUMBER} at ${HEAD_SHA}."
              exit 0
            fi
            echo "${out}"
            # Ask the PR why the merge failed rather than parse gh's message.
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.merged, .head.sha, .mergeable_state] | @tsv' 2>/dev/null)" || state=""
            # shellcheck disable=SC2086
            set -- ${state}
            merged="${1:-}" head="${2:-}" mstate="${3:-}"
            if [ "${merged}" = "true" ]; then
              echo "PR #${PR_NUMBER} is already merged; nothing to do."
              exit 0
            fi
            if [ -n "${head}" ] && [ "${head}" != "${HEAD_SHA}" ]; then
              echo "Head moved to ${head} after CI passed on ${HEAD_SHA}; not merging. The new head's CI run decides."
              exit 0
            fi
            if [ "${mstate}" = "behind" ]; then
              echo "PR #${PR_NUMBER} is behind main and the ruleset requires an up-to-date branch; not merging until Dependabot rebases it."
              exit 0
            fi
            if [ "${attempt}" -lt "${attempts}" ]; then
              echo "Merge attempt ${attempt} failed (mergeable_state=${mstate:-unknown}); retrying in 20s."
              sleep 20
            fi
          done
          echo "Merge still failing after ${attempts} attempts." >&2
          exit 1
