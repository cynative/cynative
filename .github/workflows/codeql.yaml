name: CodeQL

# Security-focused static analysis for Go, GitHub Actions workflows, and the
# Python test helpers. Complements make check (correctness) with CodeQL's query
# suite. Non-required initially; Scorecard's SAST check looks for recognized
# analyzer check runs on commits (#179).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: pick up newly published queries against unchanged code.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Guardrail against a hung analysis; well above a healthy go/actions/python run.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      # Required for private-repo / Advanced Security status checks; harmless on public.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'go'
        # Race tests need CGO; CodeQL only needs a plain build. Match the issue's
        # default-build guidance without pulling in the full make check gate.
        run: CGO_ENABLED=0 go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'
