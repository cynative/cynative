version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    # dependency-type "all" turns on updates for indirect (transitive) modules,
    # not just direct ones.
    allow:
      - dependency-type: "all"
    ignore:
      # Untagged nested modules of the charmbracelet/x monorepo. The root module
      # is tagged (v0.1.0) but these submodules have no tags, so Dependabot's Go
      # version discovery mis-resolves them to the root and fails the gomod
      # update (dependency_file_not_resolvable). Deep terminal-UI transitives
      # (via glamour and via goreleaser -> fang). Revisit if charmbracelet tags
      # the x/exp submodules.
      - dependency-name: "github.com/charmbracelet/x/exp/*"
      # glob v1.0.0 restructured the repo: the syntax/ast and syntax/lexer
      # packages are gone, but goreleaser/fileglob (v1.4.0, the latest
      # release, an indirect module via the goreleaser/v2 tool dependency)
      # still imports both, so forcing the major bump fails the whole gomod
      # update outright (dependency_file_not_resolvable at the go mod tidy
      # step). Minor/patch updates stay allowed, and once fileglob/goreleaser
      # ship a release built against the v1 layout the module graph will
      # follow without Dependabot's help. Drop this entry when that happens.
      - dependency-name: "github.com/gobwas/glob"
        update-types: ["version-update:semver-major"]
      # depguard v2.3.0 requires gobwas/glob v1.0.0, so bumping this indirect
      # module (via golangci-lint, whose v2.15.0 still pins v2.2.1) drags glob
      # to v1 through the module graph and hits the same go mod tidy failure
      # the glob entry above blocks. Patch updates stay allowed. Drop this
      # entry together with the glob entry, when fileglob/goreleaser ship a
      # release built against the glob v1 layout.
      - dependency-name: "github.com/OpenPeeDeeP/depguard/v2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # go-header v1 is a breaking API rewrite that golangci-lint (which pins
      # the v0.5.x API) cannot compile against, so forcing the major bump on
      # this indirect module breaks `go tool golangci-lint`. Minor/patch
      # updates stay allowed, and once golangci-lint itself requires v1 the
      # module graph will follow without Dependabot's help. Drop this entry
      # when that happens.
      - dependency-name: "github.com/denis-tingaikin/go-header"
        update-types: ["version-update:semver-major"]
      # go-check-sumtype v0.5.0 is a breaking API rewrite (the exported Config
      # and Run were replaced by an analysis.Analyzer-style API) that
      # golangci-lint (v2.13.2, the latest release, which calls the old API)
      # cannot compile against, so forcing the bump on this indirect module
      # breaks `go tool golangci-lint`. Patch updates stay allowed; minor is
      # ignored too because Dependabot classifies 0.4 -> 0.5 positionally as
      # semver-minor. Once golangci-lint itself requires >= v0.5.0 the module
      # graph will follow without Dependabot's help. Drop this entry when that
      # happens.
      - dependency-name: "github.com/alecthomas/go-check-sumtype"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # predeclared v0.3.0 removed the exported IgnoreFlag and QualifiedFlag
      # constants that golangci-lint (v2.14.0, the latest release) still
      # references, so forcing the bump on this indirect module breaks
      # `go tool golangci-lint`. Patch updates stay allowed; minor is ignored
      # too because Dependabot classifies 0.2 -> 0.3 positionally as
      # semver-minor. Once golangci-lint itself requires >= v0.3.0 the module
      # graph will follow without Dependabot's help. Drop this entry when that
      # happens.
      - dependency-name: "github.com/nishanths/predeclared"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # exhaustive v0.14.0 removed the exported CheckFlag,
      # DefaultSignifiesExhaustiveFlag and related flag constants that
      # golangci-lint (v2.14.0, the latest release) still references, so
      # forcing the bump on this indirect module breaks `go tool
      # golangci-lint`. Patch updates stay allowed; minor is ignored too
      # because Dependabot classifies 0.13 -> 0.14 positionally as
      # semver-minor. Once golangci-lint itself requires >= v0.14.0 the module
      # graph will follow without Dependabot's help. Drop this entry when that
      # happens.
      - dependency-name: "github.com/nishanths/exhaustive"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
  - package-ecosystem: "cargo"
    directory: "/tools/rcodesign"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
